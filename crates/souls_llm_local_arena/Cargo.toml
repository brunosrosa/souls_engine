[package]
name = "souls_llm_local_arena"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "souls_arena"
path = "src/bin/souls_arena.rs"

[dependencies]
souls_protocol = { path = "../souls_protocol" }
souls_core = { path = "../souls_core" }
souls_inference_runtime = { path = "../souls_inference_runtime" }

tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
sqlx = { workspace = true }

gigatoken-core = { package = "toktier-gigatoken-core", version = "0.3", optional = true }
memmap2 = { workspace = true, optional = true }
tiktoken = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[features]
default = ["gigatoken_bench"]
gigatoken_bench = ["dep:gigatoken-core", "dep:memmap2", "dep:tiktoken", "dep:tempfile"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = { workspace = true }
