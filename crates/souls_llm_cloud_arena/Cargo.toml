[package]
name = "souls_llm_cloud_arena"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Ingestão diária, análise de fronteira de Pareto e scoring de custo-benefício para LLMs em nuvem no Souls Engine v7"

[[bin]]
name = "souls_cloud_arena"
path = "src/bin/souls_cloud_arena.rs"

[dependencies]
souls_protocol = { path = "../souls_protocol" }
souls_core = { path = "../souls_core" }

tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
comfy-table = { workspace = true }

sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
clap = { version = "4.5", features = ["derive", "env"] }
regex = "1.10"

[dev-dependencies]
tempfile = "3.10"
