  <!-- TOP BAR -->
  <header class="topbar">
    <div class="brand-group">
      <div class="brand-mascot" onclick="switchTab('tab-overview')" title="Ir para o Overview & Cockpit">
        <img id="mascot-img" src="/dashboard/icon/cyan" alt="Souls Mascot">
      </div>
      <div>
        <div class="brand-title u-d-flex u-gap-2 u-s-7f398f">
          <span>Souls Engine</span>
          <span class="u-text-cyan u-fw-600 u-mono u-s-5ebd08" id="top-engine-version">(v0.9.3)</span>
        </div>
        <div class="brand-sub">
          <span class="pulse-dot"></span>
          <span id="top-endpoint-sub">localhost:9123 &bull; Headless Engine</span>
        </div>
      </div>
    </div>

    <div class="telemetry-pills">
      <button class="cmd-trigger-btn" id="btn-cmd-palette" onclick="openCommandPalette()" title="Abrir Paleta de Comandos Rápidos (Ctrl+K)">
        <svg class="ui-icon icon-sm" aria-hidden="true"><use href="#icon-search"></use></svg>
        <span class="cmd-trigger-label">Buscar...</span>
        <kbd class="kbd-chip">Ctrl+K</kbd>
      </button>
      <div class="telemetry-pill" id="pill-brain" title="Master Brain ativo no Hermes Agent">
        <span><svg class="ui-icon icon-sm" aria-hidden="true"><use href="#icon-brain"></use></svg> Brain</span>
        <strong id="top-brain-name">Carregando...</strong>
      </div>
      <div class="telemetry-pill" id="pill-gpu-container" title="Temperatura da GPU Ativa">
        <span><svg class="ui-icon icon-sm" aria-hidden="true"><use href="#icon-gamepad"></use></svg> GPU</span>
        <strong id="pill-temp">--°C</strong>
      </div>
      <div class="telemetry-pill" id="pill-vram-container" title="VRAM Livre e Capacidade sob SO">
        <span><svg class="ui-icon icon-sm" aria-hidden="true"><use href="#icon-zap"></use></svg> VRAM</span>
        <strong id="pill-vram">-- / -- GB</strong>
      </div>
      <div class="telemetry-pill" title="Uptime do daemon Souls Engine">
        <span><svg class="ui-icon icon-sm" aria-hidden="true"><use href="#icon-clock"></use></svg> Uptime</span>
        <strong id="pill-uptime">--m</strong>
      </div>
      <button type="button" class="telemetry-pill inbox-pill" id="pill-agent-inbox" onclick="switchTab('tab-agent-inbox')" title="Abrir Central de Aprovações">
        <span><svg class="ui-icon icon-sm" aria-hidden="true"><use href="#icon-inbox"></use></svg> Inbox</span>
        <strong id="top-inbox-count">0</strong>
      </button>
    </div>
  </header>
