  <!-- TOP BAR -->
  <header class="topbar">
    <div class="brand-group">
      <div class="brand-mascot" onclick="switchTab('tab-overview')">
        <img id="mascot-img" src="/dashboard/icon/cyan" alt="Souls Mascot">
      </div>
      <div>
        <div class="brand-title" style="display: flex; align-items: baseline; gap: 8px;">
          <span>Souls Engine</span>
          <span id="top-engine-version" style="font-size: 0.70rem; color: #94a3b8; font-weight: 500; font-family: var(--font-mono);">(v0.8.3)</span>
        </div>
        <div class="brand-sub">
          <span class="pulse-dot"></span>
          <span id="top-endpoint-sub">localhost:9123 &bull; Dev Drive Z:\</span>
        </div>
      </div>
    </div>

    <div class="telemetry-pills">
      <div class="telemetry-pill" id="pill-brain" title="Master Brain ativo no Hermes Agent">
        <span>🧠 Brain:</span>
        <strong id="top-brain-name">Carregando...</strong>
      </div>
      <div class="telemetry-pill" title="Temperatura da GPU RTX 2060m">
        <span>🎮 GPU:</span>
        <strong id="pill-temp">--°C</strong>
      </div>
      <div class="telemetry-pill" title="VRAM Livre sob WDDM">
        <span>⚡ VRAM:</span>
        <strong id="pill-vram">-- / 5.2 GB</strong>
      </div>
      <div class="telemetry-pill" title="Uptime do servidor">
        <span>⏱️ Uptime:</span>
        <strong id="pill-uptime">--m</strong>
      </div>
    </div>
  </header>
