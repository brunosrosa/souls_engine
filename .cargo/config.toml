[build]
# Otimizado para toolchain MSVC nativa no Windows 11
target = "x86_64-pc-windows-msvc"
rustc-wrapper = "C:\\Users\\rosas\\.cargo\\bin\\sccache.exe"

[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

[env]
